<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VAULT — Page Not Found</title>
  <meta name="description" content="The requested VAULT page could not be found.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111315">
  <style>
    :root {
      color-scheme: dark;
      --bg: #111315;
      --surface: #191c1f;
      --border: #3a4248;
      --accent: #d7a84b;
      --text-1: #f3f0e8;
      --text-2: #b4babd;
      --shadow-lg: 0 18px 46px rgba(0,0,0,0.34);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text-1);
      font-family: 'DM Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(100%, 440px);
      padding: 48px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow-lg);
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .logo-icon {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid #56616a;
      border-radius: 13px;
      background: rgba(215,168,75,0.13);
      font-family: system-ui, sans-serif;
      font-size: 20px;
    }
    .code {
      margin: 0;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 10px 0 10px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(28px, 8vw, 38px);
      line-height: 1.15;
    }
    p {
      margin: 0 0 28px;
      color: var(--text-2);
      font-size: 14px;
      line-height: 1.6;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 11px 20px;
      border-radius: 9px;
      background: var(--accent);
      color: #17130b;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { filter: brightness(1.08); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (max-width: 520px) { main { padding: 32px 24px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main aria-labelledby="not-found-title">
    <div class="logo" aria-label="VAULT">
      <span class="logo-icon" aria-hidden="true">🔐</span>
      <span>VAULT</span>
    </div>
    <p class="code">Error 404</p>
    <h1 id="not-found-title">Page not found</h1>
    <p>The page you requested is unavailable. Return to the private sign-in screen to continue.</p>
    <a href="/">Return to VAULT</a>
  </main>
</body>
</html>
